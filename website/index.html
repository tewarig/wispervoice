<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WisperVoice — Dictate at the speed of thought. For Mac.</title>
    <meta name="description" content="WisperVoice is a native Mac dictation app. Press a hotkey, speak naturally, and watch your words appear in any app — polished, accurate, and private." />
    <meta property="og:title" content="WisperVoice — Dictate at the speed of thought" />
    <meta property="og:description" content="Native Mac dictation that works everywhere. 100+ languages, AI polish, no friction." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cfc'/%3E%3Cpath d='M16 8a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0v-5a4 4 0 0 0-4-4zm-6 9a6 6 0 0 0 12 0M16 23v3' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body class="antialiased">
    <script>
      // Apply saved/system theme before first paint to avoid light-mode flash.
      // Mirrors ThemeSwitcher's fallback exactly: anything that isn't an explicit
      // "light"/"dark" (unknown values, blocked storage) is treated as "system",
      // and the matchMedia probe runs outside the storage try so a throwing
      // localStorage still respects the OS preference.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        var isDark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
