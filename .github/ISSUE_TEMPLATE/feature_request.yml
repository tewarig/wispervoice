name: Feature request
description: Suggest an idea or Wispr Flow parity improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make WisperVoice better? Tell us about it.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user problem does this solve? Is it Wispr Flow parity?
      placeholder: "As a user who dictates in Xcode, I want … so that …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? UI, hotkey, provider, settings, etc.
      placeholder: Add a hold-to-talk mode (Cmd+Shift+;) …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Hotkey / Overlay, Transcription, Text injection, Settings, Models, Packaging / Updates, Other]
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Could also be done via …
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this isn't already requested
          required: true
        - label: I would be willing to open a PR for this
          required: false
